<h2 class="mb-4">Retrieve & Reuse</h2>

<div class="card p-4 shadow-sm">

    <div class="row">

        <!-- Dependents -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Number of Dependents</label>
            <input type="number" id="no_of_dependents"
                class="form-control"
                placeholder="Example: 2">
        </div>

        <!-- Education -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Education</label>

            <select id="education" class="form-select">
                <option value="Graduate">Graduate</option>
                <option value="Not Graduate">Not Graduate</option>
            </select>
        </div>

        <!-- Self Employed -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Self Employed</label>

            <select id="self_employed" class="form-select">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <!-- Income -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Annual Income</label>

            <input type="number" id="income_annum"
                class="form-control"
                placeholder="Example: 500000">
        </div>

        <!-- Loan Amount -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Loan Amount</label>

            <input type="number" id="loan_amount"
                class="form-control"
                placeholder="Example: 100000">
        </div>

        <!-- Loan Term -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Loan Term</label>

            <input type="number" id="loan_term"
                class="form-control"
                placeholder="Example: 12">
        </div>

        <!-- Cibil -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Cibil Score</label>

            <input type="number" id="cibil_score"
                class="form-control"
                placeholder="Example: 750">
        </div>

        <!-- Residential -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Residential Assets</label>

            <input type="number" id="residential_assets_value"
                class="form-control"
                placeholder="Example: 300000">
        </div>

        <!-- Commercial -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Commercial Assets</label>

            <input type="number" id="commercial_assets_value"
                class="form-control"
                placeholder="Example: 100000">
        </div>

        <!-- Luxury -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Luxury Assets</label>

            <input type="number" id="luxury_assets_value"
                class="form-control"
                placeholder="Example: 50000">
        </div>

        <!-- Bank -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Bank Asset Value</label>

            <input type="number" id="bank_asset_value"
                class="form-control"
                placeholder="Example: 200000">
        </div>

    </div>

    <button class="btn btn-primary mt-3"
        onclick="checkLoan()">

        Analyze Loan Eligibility

    </button>

</div>

<!-- RESULT -->
<div id="result-area" class="mt-4"></div>
