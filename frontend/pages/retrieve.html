<h2 class="mb-2">Analisis Pinjaman</h2>
<p class="text-muted mb-4">
  Masukkan data pemohon untuk mendapatkan prediksi kelayakan pinjaman
</p>

<div class="card shadow-sm border-0 p-4">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Number of Dependents (Jumlah Tanggungan)</label>
      <input
        type="text"
        id="no_of_dependents"
        class="form-control format-number"
        placeholder="Example: 2"
      />
      <div
        id="err-no_of_dependents"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Education (Tingkat Pendidikan)</label>
      <select id="education" class="form-select">
        <option value="Graduate">Graduate</option>
        <option value="Not Graduate">Not Graduate</option>
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Self Employed (Wiraswasta)</label>
      <select id="self_employed" class="form-select">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Annual Income (Pendapatan Tahunan)</label>
      <input
        type="text"
        id="income_annum"
        class="form-control format-number"
        placeholder="Example: 100.000"
      />
      <div
        id="err-income_annum"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Loan Amount (Jumlah Pinjaman)</label>
      <input
        type="text"
        id="loan_amount"
        class="form-control format-number"
        placeholder="Example: 100.000"
      />
      <div
        id="err-loan_amount"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Loan Term (Jangka Waktu Pinjaman)</label>
      <input
        type="text"
        id="loan_term"
        class="form-control format-number"
        placeholder="Example: 12"
      />
      <div
        id="err-loan_term"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Cibil Score</label>
      <input
        type="text"
        id="cibil_score"
        class="form-control format-number"
        placeholder="Example: 750"
      />
      <div
        id="err-cibil_score"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Residential Assets (Aset Rumah)</label>
      <input
        type="text"
        id="residential_assets_value"
        class="form-control format-number"
        placeholder="Example: 100.000"
      />
      <div
        id="err-residential_assets_value"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Commercial Assets (Aset Komersial)</label>
      <input
        type="text"
        id="commercial_assets_value"
        class="form-control format-number"
        placeholder="Example: 100.000"
      />
      <div
        id="err-commercial_assets_value"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Luxury Assets (Aset Mewah)</label>
      <input
        type="text"
        id="luxury_assets_value"
        class="form-control format-number"
        placeholder="Example: 100.000"
      />
      <div
        id="err-luxury_assets_value"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Bank Asset Value (Aset Bank)</label>
      <input
        type="text"
        id="bank_asset_value"
        class="form-control format-number"
        placeholder="Example: 100.000"
      />
      <div
        id="err-bank_asset_value"
        class="text-danger small mt-1"
        style="display: none"
      ></div>
    </div>
  </div>
  <div class="mt-3">
    <button id="analyzeBtn" type="button" class="btn btn-primary px-4">
      Analisis Pinjaman
    </button>
  </div>
</div>

<!-- RESULT -->
<div id="result-area" class="mt-4"></div>

<!-- ACTION BUTTONS (muncul setelah analyze) -->
<div id="action-buttons" class="mt-3 d-none">
  <button id="btn-edit" class="btn btn-warning me-2">Edit Data</button>
  <button id="btn-new" class="btn btn-secondary me-2">Input Kasus Baru</button>
  <button id="btn-revise" class="btn btn-success">Lihat Antrian Revisi</button>
</div>
