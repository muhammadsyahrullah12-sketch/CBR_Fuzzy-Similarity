<h2 class="mb-2">Basis Kasus</h2>
<p class="text-muted mb-3">Seluruh kasus yang digunakan sistem CBR</p>

<!-- Header info + filter -->
<div
  class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2"
>
  <div id="bk-total-info" class="fw-semibold"></div>
  <div class="btn-group" role="group">
    <button
      id="filter-all"
      class="btn btn-sm btn-primary"
      onclick="filterBasisKasus(null)"
    >
      Semua
    </button>
    <button
      id="filter-initial"
      class="btn btn-sm btn-outline-secondary"
      onclick="filterBasisKasus('initial')"
    >
      Kasus Awal
    </button>
    <button
      id="filter-retained"
      class="btn btn-sm btn-outline-success"
      onclick="filterBasisKasus('retained')"
    >
      Retained
    </button>
  </div>
</div>

<!-- Tabel Basis Kasus -->
<div class="card shadow-sm p-3">
  <div class="table-responsive">
    <table
      id="bk-table"
      class="table table-bordered table-hover align-middle text-center"
      style="font-size: 13px"
    >
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Tanggungan</th>
          <th>Pendidikan</th>
          <th>Wiraswasta</th>
          <th>Pendapatan</th>
          <th>Tenor</th>
          <th>Jangka Waktu</th>
          <th>CIBIL</th>
          <th>Aset Rumah</th>
          <th>Aset Komersial</th>
          <th>Aset Mewah</th>
          <th>Aset Bank</th>
          <th>Keputusan</th>
        </tr>
      </thead>
      <tbody id="bk-table-body">
        <tr>
          <td colspan="10" class="text-center">Memuat data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div
    class="d-flex align-items-center justify-content-between nt-3 flex-wrap fap-2"
  >
    <div id="bk-page-info" class="text-muted small"></div>
    <div class="d-flex gap-2">
      <button
        id="btn-prev"
        class="btn btn-sm btn-outline-primary"
        onclick="changePage(-1)"
        disabled
      >
        ← Prev
      </button>
      <button
        id="btn-next"
        class="btn btn-sm btn-outline-primary"
        onclick="changePage(1)"
        disabled
      >
        Next →
      </button>
      <button
        id="btn-last"
        class="btn btn-sm btn-outline-secondary"
        onclick="goToLastPage()"
        disabled
      >
        Last
      </button>
    </div>
  </div>
</div>
