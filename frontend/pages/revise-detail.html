<!-- Tombol kembali -->
<div class="mb-4">
  <button class="btn btn-outline-secondary" onclick="showRevise()">
    ← Kembali ke Daftar Antrian
  </button>
</div>

<h2 class="mb-1">Detail Kasus</h2>
<p class="text-muted mb-4" id="detail-queue-id"></p>

<div class="row g-4">
  <!-- Kolom kiri: Data Pemohon + Keputusan Pakar -->
  <div class="col-lg-5">
    <!-- Data Input Pemohon -->
    <div class="card shadow-sm p-4 mb-4">
      <h5 class="mb-3 border-bottom pb-2">Data Pemohon</h5>
      <table class="table table-sm table-borderless mb-0">
        <tbody id="detail-input-data"></tbody>
      </table>
    </div>

    <!-- Keputusan Pakar -->
    <div class="card shadow-sm p-4 border-success">
      <h5 class="mb-3 border-bottom pb-2 text-success">Keputusan Pakar</h5>
      <p class="text-muted small mb-3">
        Pertimbangkan data pemohon dan rekomendasi sistem sebelum membuat
        keputusan.
      </p>
      <label class="form-label fw-semibold">Keputusan Akhir</label>
      <select id="detail-decision" class="form-select mb-3">
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
      </select>
      <button
        id="detail-save-btn"
        class="btn btn-success w-100"
        onclick="saveReviseFromDetail()"
      >
        Simpan Keputusan
      </button>
    </div>
  </div>

  <!-- Kolom kanan: Rekomendasi Sistem + Top 5 -->
  <div class="col-lg-7">
    <!-- Rekomendasi Sistem -->
    <div class="card shadow-sm p-4 mb-4">
      <h5 class="mb-3 border-bottom pb-2">Rekomendasi Sistem</h5>
      <div id="detail-recommendation"></div>
    </div>

    <!-- Top 5 Kasus Serupa -->
    <div class="card shadow-sm p-4">
      <h5 class="mb-3 border-bottom pb-2">🔍 Top 5 Kasus Serupa</h5>
      <div class="table-responsive">
        <table class="table table-bordered table-sm">
          <thead class="table-dark">
            <tr>
              <th>Rank</th>
              <th>Loan ID</th>
              <th>Decision</th>
              <th>Similarity</th>
            </tr>
          </thead>
          <tbody id="detail-top-cases"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
