<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBR Loan Approval</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="d-flex">
      <!-- SIDEBAR -->
      <div class="sidebar bg-dark text-white p-3">
        <h2 class="mb-4">Loan Prediction</h2>
        <ul class="nav flex-column">
          <li class="nav-item mb-2">
            <button
              id="menu-retrieve"
              class="nav-link text-white active w-100 text-start border-0 bg-transparent"
              onclick="showRetrieve()"
            >
              Analisis Pinjaman
            </button>
          </li>
          <li class="nav-item mb-2">
            <button
              id="menu-revise"
              class="nav-link text-white w-100 text-start border-0 bg-transparent"
              onclick="showRevise()"
            >
              Verifikasi Hasil
            </button>
          </li>
          <li class="nav-item mb-2">
            <button
              id="menu-history"
              class="nav-link text-white w-100 text-start border-0 bg-transparent"
              onclick="showHistory()"
            >
              Riwayat Keputusan
            </button>
          </li>
          <li class="nav-item mb-2">
            <button id="menu-basis-kasus" class="nav-link text-white w-100 text-start border-0 bg-transparent" onclick="showBasisKasus()">
              Data Kasus
          </li>
          <li class="nav-item mb-2">
            <button
              id="menu-evaluation"
              class="nav-link text-white w-100 text-start border-0 bg-transparent"
              onclick="showEvaluation()"
            >
              Evaluasi
            </button>
          </li>
        </ul>
      </div>

      <!-- MAIN CONTENT -->
      <div id="main-content" class="main-content p-4 w-100">
        <!-- konten dimuat dinamis oleh app.js -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
