<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        CBR Loan Approval
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="d-flex">

        <!-- SIDEBAR -->
        <div class="sidebar bg-dark text-white p-3">

            <h2 class="mb-4">
                CBR System
            </h2>

            <ul class="nav flex-column">

                <!-- Retrieve -->
                <li class="nav-item mb-2">

                    <a href="#"
                       id="menu-retrieve"
                       class="nav-link text-white active"
                       onclick="showRetrieve()">

                        Retrieve & Reuse

                    </a>

                </li>

                <!-- Revise -->
                <li class="nav-item mb-2">

                    <a href="#"
                       id="menu-revise"
                       class="nav-link text-white"
                       onclick="showRevise()">

                        Revise

                    </a>

                </li>

                <!-- Database -->
                <li class="nav-item mb-2">

                    <a href="#"
                       id="menu-database"
                       class="nav-link text-white"
                       onclick="showDatabase()">

                        Database

                    </a>

                </li>

            </ul>

        </div>

        <!-- MAIN CONTENT -->
        <div id="main-content"
             class="main-content p-4 w-100">

            <!-- TITLE -->
            <div class="mb-4">

                <h2>
                    Retrieve & Reuse
                </h2>

                <p class="text-muted">
                    Analyze loan eligibility using CBR Fuzzy Similarity.
                </p>

            </div>

            <!-- FORM CARD -->
            <div class="card shadow-sm border-0 p-4">

                <div class="row">

                    <!-- Dependents -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Number of Dependents
                        </label>

                        <input type="number"
                               id="no_of_dependents"
                               class="form-control"
                               placeholder="Example: 2">

                    </div>

                    <!-- Education -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Education
                        </label>

                        <select id="education"
                                class="form-select">

                            <option value="Graduate">
                                Graduate
                            </option>

                            <option value="Not Graduate">
                                Not Graduate
                            </option>

                        </select>

                    </div>

                    <!-- Self Employed -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Self Employed
                        </label>

                        <select id="self_employed"
                                class="form-select">

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No">
                                No
                            </option>

                        </select>

                    </div>

                    <!-- Income -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Annual Income
                        </label>

                        <input type="number"
                               id="income_annum"
                               class="form-control"
                               placeholder="Example: 500000">

                    </div>

                    <!-- Loan Amount -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Loan Amount
                        </label>

                        <input type="number"
                               id="loan_amount"
                               class="form-control"
                               placeholder="Example: 100000">

                    </div>

                    <!-- Loan Term -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Loan Term
                        </label>

                        <input type="number"
                               id="loan_term"
                               class="form-control"
                               placeholder="Example: 12">

                    </div>

                    <!-- Cibil -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Cibil Score
                        </label>

                        <input type="number"
                               id="cibil_score"
                               class="form-control"
                               placeholder="Example: 750">

                    </div>

                    <!-- Residential -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Residential Assets
                        </label>

                        <input type="number"
                               id="residential_assets_value"
                               class="form-control"
                               placeholder="Example: 300000">

                    </div>

                    <!-- Commercial -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Commercial Assets
                        </label>

                        <input type="number"
                               id="commercial_assets_value"
                               class="form-control"
                               placeholder="Example: 100000">

                    </div>

                    <!-- Luxury -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Luxury Assets
                        </label>

                        <input type="number"
                               id="luxury_assets_value"
                               class="form-control"
                               placeholder="Example: 50000">

                    </div>

                    <!-- Bank -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Bank Asset Value
                        </label>

                        <input type="number"
                               id="bank_asset_value"
                               class="form-control"
                               placeholder="Example: 200000">

                    </div>

                </div>

                <!-- BUTTON -->
                <div class="mt-3">

                    <button id="analyzeBtn"
                            type="button"
                            class="btn btn-primary px-4">

                        Analyze Loan Eligibility

                    </button>

                </div>

            </div>

            <!-- RESULT -->
            <div id="result-area"
                 class="mt-4"></div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- APP JS -->
    <script src="js/app.js"></script>

</body>
</html>
